<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pitchball Fantasy | Player Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="fantasy-style.css" />
</head>
<body data-page="players">
  <div class="fantasy-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <span>Pitchball Fantasy</span>
      </div>
      <nav class="topnav">
        <a href="index.html" class="nav-link">Index</a>
        <a href="fantasy-build.html" class="nav-link">Build Your Team</a>
        <a href="fantasy-leaderboard.html" class="nav-link">Leaderboard</a>
        <a href="fantasy-players.html" class="nav-link active">Player Stats</a>
      </nav>
      <button id="sign-in-button" class="auth-button" type="button">Sign in</button>
    </header>

    <div class="page-header">
      <div>
        <p class="section-title">Stats Hub</p>
        <h1>Player Stats</h1>
      </div>
      <div class="status-pill"><span class="status-dot"></span>Fantasy Data</div>
    </div>

    <section class="panel" style="padding: 18px; margin-top: 20px;">
      <div class="table-card">
        <table id="playersTable"></table>
      </div>
    </section>
  </div>

  <div id="player-detail-overlay" class="player-detail-overlay" hidden>
    <article class="player-detail-modal" role="dialog" aria-modal="true" aria-labelledby="player-detail-name">
      <button id="close-player-detail" class="detail-close" type="button" aria-label="Close player details">&times;</button>
      <div id="player-detail-content"></div>
    </article>
  </div>

  <div id="fantasy-auth-overlay" class="auth-overlay">
    <div class="auth-modal">
      <div class="auth-modal-header">
        <h3 id="fantasy-auth-title">Sign in to continue</h3>
        <button id="close-auth" type="button" class="small-btn">Close</button>
      </div>
      <div class="auth-tabs">
        <button id="fantasy-sign-in-tab" class="auth-tab active" type="button">Sign in</button>
        <button id="fantasy-register-tab" class="auth-tab" type="button">Register</button>
      </div>
      <form id="fantasy-auth-form" class="auth-form" data-mode="login">
        <label for="fantasy-username">Username</label>
        <input id="fantasy-username" type="text" placeholder="Username or email" autocomplete="username" required />
        <div>
          <label for="fantasy-email">Email</label>
          <input id="fantasy-email" type="email" placeholder="your@email.com" autocomplete="email" />
        </div>
        <label for="fantasy-password">Password</label>
        <input id="fantasy-password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
        <div id="fantasy-auth-error" class="auth-error" role="alert" hidden></div>
        <button id="fantasy-auth-submit" class="primary-btn" type="submit">Sign in</button>
      </form>
    </div>
  </div>

  <script src="fantasy-data.js"></script>
  <script src="fantasy-app.js"></script>
</body>
</html>
